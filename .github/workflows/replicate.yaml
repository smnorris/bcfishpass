name: replicate
run-name: ${{ github.actor }} Replicate data from BC WFS / DRA to S3
on:
  schedule:
    # github.event.schedule is matched against these strings in the job conditions below,
    # if editing a cron expression, update the matching condition
    - cron: '10 5 15 * *'   # monthly: 15th
    - cron: '10 5 * * 2'    # weekly: Tuesday UTC (Monday evening Pacific)
  workflow_dispatch:
    inputs:
      replicate:
        description: Which replication to run
        type: choice
        options: [weekly, monthly, both]
        default: weekly
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_KEY: ${{ secrets.SSH_KEY }}
  SSH_HOST: ${{ secrets.SSH_HOST }}
  DRAPWD: ${{ secrets.DRAPWD }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL: https://nrs.objectstore.gov.bc.ca
  AWS_S3_ENDPOINT: nrs.objectstore.gov.bc.ca
  AWS_VIRTUAL_HOSTING: FALSE
  AWS_EC2_METADATA_DISABLED: True
  CPL_VSISTDIN_BUFFER_LIMIT: -1
concurrency:
  group: ng-prod
jobs:
  monthly:
    if: github.event.schedule == '10 5 15 * *' || inputs.replicate == 'monthly' || inputs.replicate == 'both'
    runs-on: ubuntu-latest
    environment: ng-prod
    container: ghcr.io/smnorris/bcfishpass-runner:main
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Monthly replication
        run: |
          jobs/connect
          cd jobs && ./replicate_bcgw M && ./replicate_dra

  weekly:
    needs: monthly
    if: >-
      !cancelled() &&
      (github.event.schedule == '10 5 * * 2' || inputs.replicate == 'weekly' || inputs.replicate == 'both')
    runs-on: ubuntu-latest
    environment: ng-prod
    container: ghcr.io/smnorris/bcfishpass-runner:main
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Weekly replication and bcfishobs
        run: |
          jobs/connect
          cd jobs && ./replicate_bcgw W
          git clone https://github.com/smnorris/bcfishobs.git
          cd bcfishobs && git checkout v0.3.2
          ./process.sh
